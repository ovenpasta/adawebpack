#  Build the AdaWebPack examples with Alire against the latest gnat_llvm
#  toolchain release of ovenpasta/gnat-llvm (which builds the runtimes from
#  this repository), and smoke-test HAC under node.

name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      gnat_llvm_release:
        description: "ovenpasta/gnat-llvm release tag (default: latest)"
        default: ""

env:
  EMSDK_VERSION: "5.0.2"   # must match the gnat-llvm release build

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      #  The default gnat_native gprbuild selection is fine: crates that
      #  depend on gnat_llvm use it regardless.
      - uses: alire-project/setup-alire@v6

      #  The gnat_llvm crate is not in the community index (yet): build a
      #  one-crate index from the manifest attached to the release.
      - name: Add the gnat_llvm index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/index/gn/gnat_llvm"
          echo 'version = "1.4.0"' > "$RUNNER_TEMP/index/index.toml"
          gh release download ${{ inputs.gnat_llvm_release }} \
            -R ovenpasta/gnat-llvm --pattern 'gnat_llvm-*.toml' \
            -D "$RUNNER_TEMP/index/gn/gnat_llvm"
          cat "$RUNNER_TEMP"/index/gn/gnat_llvm/*.toml
          alr index --add "$RUNNER_TEMP/index" --name gnat_llvm

      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: ${{ env.EMSDK_VERSION }}

      - name: Build the standalone examples
        run: |
          for e in call_ada toggle_hidden webgl_basic; do
            (cd examples/$e && alr -n build)
            test -f examples/$e/main.wasm
          done

      - name: Build HAC
        working-directory: examples/hac_web
        run: |
          alr -n build
          test -f hac_web.wasm && test -f hac_cli.wasm

      - name: Smoke-test HAC under node
        working-directory: examples/hac_web/hac
        run: |
          set -x
          node ../hac_cli.js exm/hello.adb | grep -q "Hello world!"
          node ../hac_cli.js exm/ackermann.adb
          #  Unhandled exception in the HAC program: exit 1 with a trace-back
          (cd test && ! node ../../hac_cli.js exception_01.adb)
          #  --!hac_add_to_path and self-checking exit status
          (cd exm/aoc/2024 && node ../../../../hac_cli.js aoc_2024_01.adb)
          node ../hac_cli.js -c exm/hello.adb
